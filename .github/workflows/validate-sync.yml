name: Validate multiplayer foundation
on:
  pull_request:
  push:
    branches: [codex/multiplayer-foundation, bopli_test.2.6]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:cloud
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sync-test-results
          path: |
            test-results
            *-debug.log
