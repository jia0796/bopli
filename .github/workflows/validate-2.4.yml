name: Validate bopli_test.2.4

on:
  push:
    branches: [bopli_test.2.4]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run domain, stress, and UI tests
        run: npm test
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high

  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install locked app dependencies
        run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile E2E
        run: npx playwright test
      - name: Upload E2E report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-report-2.4
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 5
